<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>选号助手</title><style>
:root{color-scheme:dark;--bg:#090f1e;--panel:#151e32;--line:#2a3650;--text:#f2f6ff;--muted:#94a4be;--accent:#7c9cff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse 90% 350px at 50% -80px,#223e78 0%,#0b1428 75%,#090f1e 100%);color:var(--text);font:15px -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;-webkit-tap-highlight-color:transparent}.wrap{max-width:760px;margin:auto;padding:18px 14px 100px}h1{font-size:29px;letter-spacing:1px;margin:0;font-weight:850}h2{font-size:16px;margin:0 0 14px;font-weight:750;letter-spacing:.3px}.hero{padding:22px 6px 13px}.hero p{color:#a7b9d9;margin:9px 0 4px;font-size:13px}.hero-tag{display:inline-flex;align-items:center;padding:5px 10px;border:1px solid #536da5;border-radius:30px;color:#bed0ff;font-size:11px;margin-bottom:12px;background:#24395c}.card{background:linear-gradient(145deg,#19253c,#131d30);border:1px solid #293751;border-radius:22px;padding:19px 16px;margin:13px 0;box-shadow:0 12px 30px #0002}.choices{display:flex;flex-wrap:wrap;gap:10px}.circle{border:1px solid #3a4a64;background:#202c43;border-radius:50%;width:45px;height:45px;font-size:15px;color:#d8e4fa;font-weight:650;transition:.15s;cursor:pointer}.circle.on{background:linear-gradient(140deg,#89a8ff,#4c6fe7);color:white;border-color:#b3c4ff;box-shadow:0 0 0 3px #7196ff2b,0 5px 15px #4266d24d;transform:translateY(-1px)}.pill{border:1px solid #3c4d6b;background:#222f47;border-radius:13px;padding:11px 20px;color:#d6e2fa;font-weight:700;font-size:14px;cursor:pointer}.pill.on{background:#6988ee;border-color:#a8bbff;color:white;box-shadow:0 5px 16px #5579ee44}.hint{color:var(--muted);font-size:12px;margin:13px 0 0;line-height:1.65}.actions{display:flex;gap:9px;flex-wrap:wrap}.action{background:linear-gradient(135deg,#7395ff,#506ee0);border:1px solid #8ca5ff;color:white;border-radius:13px;padding:13px 16px;font-weight:750;cursor:pointer;min-height:44px;box-shadow:0 5px 15px #3c58c233}.secondary{background:#25334e;border-color:#3c4d6a;color:#d9e5ff;box-shadow:none}.actions .action:first-child{flex:1}.numbers{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;min-height:32px}.ball{display:inline-flex;width:44px;height:44px;align-items:center;justify-content:center;border-radius:50%;color:white;font-weight:800;font-size:16px;border:2px solid #ffffff44;box-shadow:inset 0 3px 4px #ffffff30,inset 0 -5px 7px #0003,0 4px 9px #0004}.红{background:radial-gradient(circle at 32% 25%,#ff8994,#ed465b 65%,#b91e3b)}.蓝{background:radial-gradient(circle at 32% 25%,#8acaff,#347de9 65%,#1d49b0)}.绿{background:radial-gradient(circle at 32% 25%,#7beec0,#20b789 65%,#087d5c)}.count{font-size:12px;margin-left:8px;padding:5px 9px;border-radius:20px;background:#293956;color:#c1d2f6;vertical-align:2px}.mapping{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.mapping label{font-size:13px;background:#1f2b42;border:1px solid #34435c;border-radius:13px;padding:11px;font-weight:750}.mapping select{width:100%;margin-top:8px;padding:9px 4px;border:1px solid #405170;border-radius:8px;background:#111c30;color:#e7efff;font-size:13px}.hidden{display:none}details.settings-fold>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px}details.settings-fold>summary::-webkit-details-marker{display:none}.settings-fold .fold-arrow{font-size:20px;color:#a8bbff;transition:transform .2s}.settings-fold[open] .fold-arrow{transform:rotate(180deg)}.settings-body{padding-top:14px}.empty-state{padding:22px 12px;text-align:center;color:#a8b8d5;font-size:13px;line-height:1.8;border:1px dashed #3b4c6a;border-radius:13px;margin-top:12px}.result{border:1px solid #2e3d57;background:#111c30;border-radius:16px;padding:15px;margin-top:12px}.result h2{margin-bottom:4px}.result:nth-child(1){border-left:3px solid #83a0ff}.result:nth-child(2){border-left:3px solid #4ed5bd}.result:nth-child(3){border-left:3px solid #f6ba70}small{color:#8b9bb7}.section-label{font-size:11px;color:#8da4d6;letter-spacing:2px;font-weight:800;margin-bottom:8px}.filters-row{border-bottom:1px solid #2b3850;margin-bottom:16px;padding-bottom:1px}.filters-row:last-child{border:0;margin:0}.filters-row h2{display:flex;align-items:center}.filters-row h2:before{content:'';width:5px;height:16px;background:#7796ff;border-radius:4px;margin-right:9px}.circle:active,.pill:active,.action:active{transform:scale(.95)}button{touch-action:manipulation}@media(min-width:600px){.mapping{grid-template-columns:repeat(4,minmax(0,1fr))}.wrap{padding:25px 22px 90px}.card{padding:22px}.circle{width:49px;height:49px}}@media(max-width:360px){.circle{width:41px;height:41px}.choices{gap:8px}.ball{width:40px;height:40px}}
</style></head><body><main class="wrap"><header class="hero"><div class="hero-tag">✦ 智能交叉筛选 · 本地离线版</div><h1>选号助手 <span style="font-size:15px;color:#8da9ff">PRO</span></h1><p>精准筛选 · 三组结果 · 自定义年度映射</p></header><div class="card"><div class="section-label">ZODIAC / 生肖选择</div><h2>生肖（可多选）</h2><div class="choices" id="zodiac"></div><p class="hint">未选择生肖时默认不限制生肖；其他筛选条件同理。</p></div><div class="card"><div class="section-label">FILTER CONDITIONS / 筛选条件</div><div id="filters"></div></div><div class="card"><div class="section-label">GROUP / 分组筛选</div><h2>家 / 野 / 天 / 地（主号条件）</h2><div class="choices" id="group"></div><p class="hint">可选一个分组；未选则主号不附加分组限制。副号为满足全部1–4条件但不属于所选分组的号码。</p></div><div class="card"><div class="actions"><button class="action" onclick="calculate()">生成号码</button><button class="action secondary" onclick="clearFilters()">清空筛选</button><button class="action secondary" onclick="copyResults()">复制结果</button></div><div class="section-label" style="margin-top:21px">RESULTS / 筛选结果</div><section id="results"></section></div><div class="card"><details class="settings-fold"><summary><span><span class="section-label" style="display:block">SETTINGS / 全局配置</span><strong style="font-size:16px">全局号码映射表（可修改）</strong></span><span class="fold-arrow">⌄</span></summary><div class="settings-body"><p class="hint">每个号码的生肖、五行和波色均可修改。修改后自动重新筛选并保存在本机浏览器中。</p><div class="actions"><button class="action secondary" onclick="resetMap()">恢复默认映射</button><button class="action secondary" onclick="exportMap()">导出映射 JSON</button><button class="action secondary" onclick="document.getElementById('importFile').click()">导入映射</button><input type="file" id="importFile" accept="application/json,.json" class="hidden" onchange="importMap(event)"></div><div class="mapping" id="mapping" style="margin-top:12px"></div></div></details></div></main><script>
const signs='鼠牛虎兔龙蛇马羊猴鸡狗猪'.split('');const elements='金木水火土'.split('');const colors='红蓝绿'.split('');const groups={家:'牛马羊鸡狗猪',野:'鼠虎兔龙蛇猴',天:'龙兔牛马猴猪',地:'鼠虎蛇羊鸡狗'};const initialSigns={'鼠':[7,19,31,43],'牛':[6,18,30,42],'虎':[5,17,29,41],'兔':[4,16,28,40],'龙':[3,15,27,39],'蛇':[2,14,26,38],'马':[1,13,25,37,49],'羊':[12,24,36,48],'猴':[11,23,35,47],'鸡':[10,22,34,46],'狗':[9,21,33,45],'猪':[8,20,32,44]};const elementNums={金:'04 05 12 13 26 27 34 35 42 43',木:'08 09 16 17 24 25 38 39 46 47',水:'01 14 15 22 23 30 31 44 45',火:'02 03 10 11 18 19 32 33 40 41 48 49',土:'06 07 20 21 28 29 36 37'};const colorNums={红:'01 07 13 19 23 29 35 45 02 08 12 18 24 30 34 40 46',蓝:'03 09 15 25 31 37 41 47 04 10 14 20 26 36 42 48',绿:'05 11 17 21 27 33 39 43 49 06 16 22 28 32 38 44'};function defaults(){return Array.from({length:49},(_,i)=>{let n=i+1;return {n,z:signs.find(s=>initialSigns[s].includes(n)),e:elements.find(e=>elementNums[e].split(' ').map(Number).includes(n)),c:colors.find(c=>colorNums[c].split(' ').map(Number).includes(n))}})};function load(){try{let v=JSON.parse(localStorage.getItem('numberMap'));if(Array.isArray(v)&&v.length===49&&v.every((r,i)=>r.n===i+1&&signs.includes(r.z)&&elements.includes(r.e)&&colors.includes(r.c)))return v}catch(e){}return defaults()};let map=load(),selected={z:new Set(),e:new Set(),tail:new Set(),head:new Set(),c:new Set(),g:new Set()};function makeButtons(id,values,key,cls='circle'){let el=document.getElementById(id);el.innerHTML='';values.forEach(v=>{let b=document.createElement('button');b.className=cls+(selected[key].has(v)?' on':'');b.textContent=v;b.onclick=()=>{if(key==='g'){let was=selected.g.has(v);selected.g.clear();if(!was)selected.g.add(v)}else if(selected[key].has(v))selected[key].delete(v);else selected[key].add(v);refreshButtons();calculate()};el.appendChild(b)})};function refreshButtons(){makeButtons('zodiac',signs,'z');makeButtons('group',Object.keys(groups),'g','pill');[['e',elements],['tail','0123456789'.split('')],['head','01234'.split('')],['c',colors]].forEach(([key,values])=>makeButtons('f_'+key,values,key))};document.getElementById('filters').innerHTML=[['e','1. 五行'],['tail','2. 尾数'],['head','3. 头数'],['c','4. 波色']].map(([k,title])=>`<div class="filters-row"><h2>${title}</h2><div class="choices" id="f_${k}" style="margin-bottom:17px"></div></div>`).join('');function passes(r,keys){return keys.every(k=>{let s=selected[k];if(!s.size)return true;let v=k==='z'?r.z:k==='e'?r.e:k==='c'?r.c:k==='tail'?String(r.n%10):String(Math.floor(r.n/10));return s.has(v)})};let latest={};function calculate(){if(!Object.values(selected).some(s=>s.size)){latest={主号:[],副号:[],防号:[]};document.getElementById('results').innerHTML='<div class="empty-state">请先选择生肖或筛选条件，再生成号码</div>';return}let chosen=Array.from(selected.g)[0];let base=map.filter(r=>passes(r,['z','e','tail','head','c']));let main=base.filter(r=>!chosen||groups[chosen].includes(r.z));let sub=chosen?base.filter(r=>!groups[chosen].includes(r.z)):[];let excluded=new Set([...main,...sub].map(r=>r.n));let guard=map.filter(r=>passes(r,['z','e','tail'])&&!excluded.has(r.n));latest={主号:main,副号:sub,防号:guard};document.getElementById('results').innerHTML=Object.entries(latest).map(([name,arr])=>`<div class="result"><h2>${name}<span class="count">${arr.length} 个</span></h2><div class="numbers">${arr.map(r=>`<span class="ball ${r.c}" title="${r.z} ${r.e} ${r.c}">${String(r.n).padStart(2,'0')}</span>`).join('')||'<small>无符合号码</small>'}</div></div>`).join('')};function clearFilters(){Object.values(selected).forEach(s=>s.clear());refreshButtons();calculate()};function copyResults(){let t=Object.entries(latest).map(([k,v])=>`${k}(${v.length}): ${v.map(r=>String(r.n).padStart(2,'0')).join(' ')}`).join('\n');if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t).then(()=>alert('已复制')).catch(()=>fallbackCopy(t));else fallbackCopy(t)}function fallbackCopy(t){let a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');alert('已复制')}catch(e){alert('请手动复制')}a.remove()};function save(){try{localStorage.setItem('numberMap',JSON.stringify(map))}catch(e){alert('保存失败，请检查浏览器存储权限')}calculate()};function renderMap(){let root=document.getElementById('mapping');root.innerHTML='';map.forEach(r=>{let l=document.createElement('label');l.textContent=String(r.n).padStart(2,'0')+' 号';for(let [key,values] of [['z',signs],['e',elements],['c',colors]]){let sel=document.createElement('select');sel.setAttribute('aria-label',r.n+'号'+key);values.forEach(v=>{let opt=document.createElement('option');opt.value=v;opt.textContent=v;sel.appendChild(opt)});sel.value=r[key];sel.onchange=()=>{r[key]=sel.value;save()};l.appendChild(sel)}root.appendChild(l)})};function resetMap(){if(confirm('确定恢复全部49个号码的默认映射？')){map=defaults();save();renderMap()}}function exportMap(){let blob=new Blob([JSON.stringify(map,null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='选号映射表.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function importMap(event){let file=event.target.files[0];if(!file)return;let reader=new FileReader();reader.onload=()=>{try{let v=JSON.parse(reader.result);if(!Array.isArray(v)||v.length!==49||!v.every((r,i)=>r.n===i+1&&signs.includes(r.z)&&elements.includes(r.e)&&colors.includes(r.c)))throw Error('格式错误');map=v;save();renderMap();alert('导入成功')}catch(e){alert('导入失败：'+e.message)}};reader.readAsText(file);event.target.value=''}refreshButtons();renderMap();calculate();
</script></body></html>
